<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="search">
      <div class="inputWrap"><i id="locationIcon" class="fa-solid fa-location-dot"></i>
      <input type="text" id="cityInput" placeholder="Enter city name">
  </div>
    <button id="clear" aria-label="Clear"><i class="fa-solid fa-xmark"></i></button>
      <button id="searchBtn" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
      <p id="errp" class="hide">Please Enter A City Name</p>
      <p id="loading" class="hide"><i class="fa-solid fa-spinner fa-spin"></i> Loading weather...</p>
    <div class="results">
    <div class="resultsInner">
    <div class="errorMessage">
      <img src="Images/Error.webp" alt="Weather Icon" id="errorIcon">
      <p id="errorText">Invalid Location :/</p>
    </div>
    <div class="allData">
      <div class="weatherImgAndTemp">
        <h1 id="countryName"></h1>
        <img src="Images/sun.png">
        <h1 id="temp">10°C</h1>
        <p id="tempDescription">Cloudy</p>
      </div>
      <div class="weatherInfo">
        <div class="iconAndtype">
          <i class="fa-solid fa-water"></i>
          <div id="humidity">
            <p class="percentage">90%</p>
            <p class="labelone">Humidity</p>
          </div>
        </div>
        <div class="iconAndtype">
          <i class="fa-solid fa-wind"></i>
          <div id="windSpeed">
            <p class="percentage">10 Km/h</p>
            <p class="labeltwo">Wind Speed</p>
          </div>
        </div>
      </div>
    </div>
    </div>
    </div>
  </div>
  <footer class="weather-footer">
  <div class="footer-content">
    <p>Created By <a class="creator-name" href="https://www.linkedin.com/in/mark-ehab-453519389/" target="_blank" rel="noopener noreferrer">Mark Ehab</a></p>
  </div>
</footer>
  <script src="main.js"></script>
</body>
</html>
